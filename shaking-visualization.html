<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iPhone (iOS Safari) で「ホーム画面に追加」した時に完全フルスクリーンにするための設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InertialDot">
    
    <title>空間慣性シミュレーター (高感度・オフライン版)</title>
    <style>
        /* 基本リセットとタッチ操作の無効化（アプリ化） */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        :root {
            --app-height: 100dvh;
        }

        body {
            background-color: #0f172a; /* slate-900 */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            
            height: 100vh;
            height: var(--app-height);
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ヘッダーUI */
        header {
            width: 100%;
            max-width: 440px;
            padding: 16px 24px 8px 24px;
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        header h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: #22d3ee; /* cyan-400 */
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
        }
        header p {
            font-size: 0.7rem;
            color: #94a3b8; /* slate-400 */
            margin-top: 4px;
            line-height: 1.3;
        }

        /* メインキャンバス領域 */
        main {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            max-height: calc(100% - 180px); 
        }
        
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1 / 1;
            background-color: #020617; /* slate-950 */
            border-radius: 24px;
            border: 1px solid #1e293b; /* slate-800 */
            overflow: hidden;
            box-shadow: 0 20px 40px -12px rgba(8, 47, 73, 0.6);
            transition: all 0.3s ease;
        }

        /* フルスクリーン表示時のスタイル */
        body.is-fullscreen .canvas-container,
        :fullscreen .canvas-container,
        :-webkit-full-screen .canvas-container {
            max-width: 100vw;
            max-height: 100dvh;
            width: 100vw;
            height: 100dvh;
            border-radius: 0;
            border: none;
            position: fixed;
            inset: 0;
            z-index: 5;
        }
        
        body.is-fullscreen header,
        body.is-fullscreen .settings-card,
        body.is-fullscreen .btn-secondary {
            opacity: 0.15;
            pointer-events: auto;
        }
        
        body.is-fullscreen header:hover,
        body.is-fullscreen .settings-card:hover {
            opacity: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 許可画面オーバーレイ（グラスモフィズム） */
        .overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(2, 6, 23, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 30;
            transition: opacity 0.3s ease;
        }
        .glass-panel {
            max-width: 320px;
            padding: 32px 24px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .icon-circle {
            width: 64px;
            height: 64px;
            background-color: rgba(34, 211, 238, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .glass-panel h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .glass-panel p {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn-primary {
            width: 100%;
            padding: 12px 24px;
            background-color: #06b6d4;
            color: #0f172a;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-primary:active {
            background-color: #22d3ee;
            transform: scale(0.97);
        }

        /* コントロール・フッター */
        footer {
            width: 100%;
            max-width: 440px;
            padding: 0 24px 20px 24px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.3s ease;
        }
        .settings-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.75rem;
            color: #cbd5e1;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 6px;
        }
        .status-val {
            color: #22d3ee;
            font-weight: 700;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
        }
        .range-slider {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            margin: 4px 0;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #06b6d4;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(6, 182, 212, 0.5);
        }

        /* アクションボタン群 */
        .btn-group {
            display: flex;
            gap: 8px;
        }
        .btn-secondary {
            flex: 2;
            padding: 12px;
            background-color: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-secondary:active {
            background-color: #334155;
        }
        .btn-icon {
            flex: 1;
            padding: 12px;
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn-icon:active {
            background-color: #334155;
            color: #ffffff;
        }
        
        .fullscreen-tip {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.8);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 100;
        }
        body.is-fullscreen .fullscreen-tip {
            display: block;
        }
    </style>
</head>
<body>

    <div class="fullscreen-tip">タップしてフルスクリーンを解除</div>

    <!-- ヘッダーUI -->
    <header id="headerUi">
        <h1>INERTIAL SPACE</h1>
        <p>スマホを水平に動かすと、描画された空間（座標）がその場に留まり続けます。</p>
    </header>

    <!-- メインシミュレーション領域 -->
    <main>
        <div id="canvasContainer" class="canvas-container">
            <!-- 画面上固定の「スマートフォンの中心点」（照準器） -->
            <div class="crosshair" style="opacity: 0.3;">
                <div class="crosshair-h" style="background-color: #ef4444;"></div>
                <div class="crosshair-v" style="background-color: #ef4444;"></div>
                <div class="crosshair-circle" style="border-color: #ef4444;"></div>
            </div>
            
            <canvas id="simulationCanvas"></canvas>
        </div>

        <!-- 許可要求画面 -->
        <div id="permissionOverlay" class="overlay">
            <div class="glass-panel">
                <div class="icon-circle">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                        <line x1="12" y1="18" x2="12.01" y2="18"></line>
                    </svg>
                </div>
                <h2>モーションセンサーの有効化</h2>
                <p>iPhoneの加速度センサーを使用して、端末の移動量に応じて座標空間を逆方向に精密にずらします。</p>
                <button id="startBtn" class="btn-primary">センサーを許可して開始</button>
            </div>
        </div>
    </main>

    <!-- コントロールパネル -->
    <footer id="footerUi">
        <div class="settings-card">
            <div class="status-row">
                <span>空間のズレ X: <strong id="valX" class="status-val">0.0 px</strong></span>
                <span>空間のズレ Y: <strong id="valY" class="status-val">0.0 px</strong></span>
            </div>
            
            <div class="slider-group">
                <div class="slider-header">
                    <span>補正感度 (座標の同期倍率)</span>
                    <span id="sensitivityVal" class="status-val">5.0x</span>
                </div>
                <input id="sensitivitySlider" type="range" min="1.0" max="25.0" step="0.5" value="5.0" class="range-slider">
            </div>

            <div class="slider-group">
                <div class="slider-header">
                    <span>空間の減衰抵抗 (ドリフトを抑える滑らかさ)</span>
                    <span id="frictionVal" class="status-val">0.96</span>
                </div>
                <input id="frictionSlider" type="range" min="0.80" max="0.99" step="0.01" value="0.96" class="range-slider">
            </div>
        </div>

        <div class="btn-group">
            <button id="calibrateBtn" class="btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
                座標を初期位置に戻す
            </button>
            
            <button id="fullscreenBtn" class="btn-icon">
                <svg id="fsIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
                <span>全画面</span>
            </button>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvasContainer');
        const permissionOverlay = document.getElementById('permissionOverlay');
        const startBtn = document.getElementById('startBtn');
        const calibrateBtn = document.getElementById('calibrateBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const valXEl = document.getElementById('valX');
        const valYEl = document.getElementById('valY');
        const sensitivitySlider = document.getElementById('sensitivitySlider');
        const sensitivityVal = document.getElementById('sensitivityVal');
        const frictionSlider = document.getElementById('frictionSlider');
        const frictionVal = document.getElementById('frictionVal');
        const fsIcon = document.getElementById('fsIcon');

        let virtualSize = 400; // 内部の仮想座標系サイズ
        
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.resetTransform();
            ctx.scale((rect.width * dpr) / virtualSize, (rect.height * dpr) / virtualSize);
        }
        
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeCanvas, 200);
        });

        function updateAppHeight() {
            document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
        }
        window.addEventListener('resize', updateAppHeight);
        updateAppHeight();

        // 空間自体のズレ位置 (現実世界に留まっているべき座標のシフト)
        const spaceOffset = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0
        };

        // センサーの物理数値
        let accelX = 0;
        let accelY = 0;
        let lastTimestamp = 0;

        let sensitivity = parseFloat(sensitivitySlider.value);
        let friction = parseFloat(frictionSlider.value); 

        sensitivitySlider.addEventListener('input', (e) => {
            sensitivity = parseFloat(e.target.value);
            sensitivityVal.textContent = sensitivity.toFixed(1) + 'x';
        });

        frictionSlider.addEventListener('input', (e) => {
            friction = parseFloat(e.target.value);
            frictionVal.textContent = friction.toFixed(2);
        });

        startBtn.addEventListener('click', async () => {
            // iOS 13+ 用のモーションアクセス許可
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        startSystem();
                    } else {
                        showCustomAlert('モーションセンサーの許可が必要です。');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    startSystem();
                }
            } else {
                startSystem();
            }
        });

        function startSystem() {
            permissionOverlay.style.opacity = '0';
            setTimeout(() => {
                permissionOverlay.style.display = 'none';
            }, 300);

            resizeCanvas();

            // 「devicemotion」から重力を除いた加速度を取得する
            window.addEventListener('devicemotion', handleMotion, true);

            lastTimestamp = performance.now();
            requestAnimationFrame(loop);
        }

        function handleMotion(event) {
            const acc = event.acceleration;
            if (acc) {
                // 加速度の値を取得
                accelX = acc.x || 0;
                accelY = acc.y || 0;
            }
        }

        function resetOffset() {
            spaceOffset.x = 0;
            spaceOffset.y = 0;
            spaceOffset.vx = 0;
            spaceOffset.vy = 0;
        }

        calibrateBtn.addEventListener('click', resetOffset);

        function toggleFullscreen() {
            const body = document.body;
            const isFsActive = document.fullscreenElement || 
                               document.webkitFullscreenElement || 
                               body.classList.contains('is-fullscreen');

            if (isFsActive) {
                body.classList.remove('is-fullscreen');
                fsIcon.innerHTML = `<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>`;
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                setTimeout(resizeCanvas, 150);
                return;
            }

            body.classList.add('is-fullscreen');
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(() => {});
            } else if (docEl.webkitRequestFullscreen) {
                try { docEl.webkitRequestFullscreen(); } catch (e) {}
            }

            fsIcon.innerHTML = `<path d="M4 14h6v6m10-6h-6v6M4 10h6V4m10 6h-6V4"></path>`;
            setTimeout(resizeCanvas, 150);
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);
        canvasContainer.addEventListener('click', () => {
            if (document.body.classList.contains('is-fullscreen')) {
                toggleFullscreen();
            }
        });

        // 物理更新と描画のループ
        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1); 
            lastTimestamp = timestamp;

            /*
              ★ 空間（座標）をその場に固定する高感度物理ロジック ★
              センサー感度の乗数を大幅に向上させ、より俊敏でダイナミックな変位を再現。
              （加速度1G = 9.8m/s^2 に対し、感度係数を大きくして画面ピクセルへ投影）
            */
            // 感度をよりダイナミックに反映させるため、基礎乗数を引き上げ
            const movementX = -accelX * sensitivity * 1500; 
            const movementY = accelY * sensitivity * 1500;  

            // 加速度を速度へ積分
            spaceOffset.vx += movementX * dt;
            spaceOffset.vy += movementY * dt;

            // 速度を位置（座標ズレ）へ積分
            spaceOffset.x += spaceOffset.vx * dt;
            spaceOffset.y += spaceOffset.vy * dt;

            // 速度に対する減衰抵抗（摩擦）の適用。
            // ※「勝手に中心に戻る引き戻し(復元力)」は完全に撤廃しました。
            spaceOffset.vx *= friction;
            spaceOffset.vy *= friction;

            // 画面表示用に現在位置を更新
            valXEl.textContent = spaceOffset.x.toFixed(1) + ' px';
            valYEl.textContent = spaceOffset.y.toFixed(1) + ' px';

            // 描画
            render();

            requestAnimationFrame(loop);
        }

        function render() {
            ctx.clearRect(0, 0, virtualSize, virtualSize);

            // 画面の基準中央座標
            const centerX = virtualSize / 2;
            const centerY = virtualSize / 2;

            // キャンバスの状態を保存して、移動した空間全体を「逆」にずらして描画する
            ctx.save();
            ctx.translate(spaceOffset.x, spaceOffset.y);

            // 1. その場所に留まり続ける背景のグリッドを描画
            ctx.strokeStyle = '#1e293b'; // slate-800
            ctx.lineWidth = 1.5;
            const step = 40;
            // 座標がどれだけ大きく動いても隙間ができないよう、描画領域を特大に拡張
            const extra = 2000;
            for (let i = -extra; i <= virtualSize + extra; i += step) {
                // 縦線
                ctx.beginPath();
                ctx.moveTo(i, -extra);
                ctx.lineTo(i, virtualSize + extra);
                ctx.stroke();

                // 横線
                ctx.beginPath();
                ctx.moveTo(-extra, i);
                ctx.lineTo(virtualSize + extra, i);
                ctx.stroke();
            }

            // 2. その場所に留まり続ける中心の「青い点」（現実空間のマーカー）
            ctx.beginPath();
            ctx.arc(centerX, centerY, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#22d3ee'; // cyan-400
            ctx.fill();

            // 青い点を強調する同心円
            ctx.strokeStyle = 'rgba(34, 211, 238, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
            ctx.stroke();

            // 空間のランドマークを複数配置し、ズレていることが視覚的にハッキリわかるようにする
            ctx.fillStyle = '#334155'; // slate-700
            const landmarks = [
                {x: centerX - 100, y: centerY - 100, size: 4},
                {x: centerX + 100, y: centerY - 100, size: 4},
                {x: centerX - 100, y: centerY + 100, size: 4},
                {x: centerX + 100, y: centerY + 100, size: 4},
                // より遠くのランドマーク
                {x: centerX - 300, y: centerY - 300, size: 6},
                {x: centerX + 300, y: centerY - 300, size: 6},
                {x: centerX - 300, y: centerY + 300, size: 6},
                {x: centerX + 300, y: centerY + 300, size: 6}
            ];
            landmarks.forEach(lm => {
                ctx.beginPath();
                ctx.arc(lm.x, lm.y, lm.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // ずらした描画空間をリセット
            ctx.restore();

            // 3. 画面に固定された基準ガイド（スマートフォンの実体を表す赤い照準器）
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)'; // red-500
            ctx.lineWidth = 1.5;
            ctx.setLineDash([2, 4]);
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // PCブラウザや非対応端末での擬似ドラッグ操作（空間をドラッグして動かす感覚）
        let dragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        canvas.addEventListener('mousedown', (e) => {
            dragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => dragging = false);
        
        canvas.addEventListener('mousemove', (e) => {
            if (!dragging || document.body.classList.contains('is-fullscreen')) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;

            // ドラッグした分だけ、現実的な感度で空間座標を直接動かせるように
            spaceOffset.x += dx * 1.5;
            spaceOffset.y += dy * 1.5;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 0 || document.body.classList.contains('is-fullscreen')) return;
            // 擬似モーションを加算
            accelX = (Math.random() - 0.5) * 8;
            accelY = (Math.random() - 0.5) * 8;
        }, { passive: true });

        // 警告モーダル
        function showCustomAlert(message) {
            const alertBox = document.createElement('div');
            alertBox.style.position = 'fixed';
            alertBox.style.top = '50%';
            alertBox.style.left = '50%';
            alertBox.style.transform = 'translate(-50%, -50%)';
            alertBox.style.backgroundColor = '#1e293b';
            alertBox.style.border = '1px solid #06b6d4';
            alertBox.style.borderRadius = '16px';
            alertBox.style.padding = '24px';
            alertBox.style.boxShadow = '0 10px 25px rgba(0,0,0,0.5)';
            alertBox.style.zIndex = '1000';
            alertBox.style.maxWidth = '300px';
            alertBox.style.width = '90%';
            alertBox.style.textAlign = 'center';
            alertBox.style.color = '#ffffff';

            const text = document.createElement('p');
            text.textContent = message;
            text.style.fontSize = '0.9rem';
            text.style.marginBottom = '16px';
            text.style.lineHeight = '1.4';
            alertBox.appendChild(text);

            const closeBtn = document.createElement('button');
            closeBtn.textContent = '閉じる';
            closeBtn.className = 'btn-primary';
            closeBtn.onclick = () => {
                document.body.removeChild(alertBox);
            };
            alertBox.appendChild(closeBtn);

            document.body.appendChild(alertBox);
        }
    </script>
</body>
</html>
